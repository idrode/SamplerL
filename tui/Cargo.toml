[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[dependencies]
engine = { version = "0.1.0", path = "../engine" }
libc = "0.2"
midir = { version = "0.11", optional = true }
ratatui = "0.30.2"
ratatui-textarea = { version = "0.9.3", features = ["search"] }
regex = "1"
rtrb = "0.4"
script = { version = "0.1.0", path = "../script" }
toml = { version = "1", default-features = false, features = ["parse", "std", "serde", "preserve_order"] }

[dev-dependencies]
hound = "3.5.1"

[features]
default = ["midi"]
# Entrada y salida MIDI reales (ALSA por midir; la lógica no depende de esto).
midi = ["dep:midir"]
